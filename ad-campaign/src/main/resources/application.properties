spring.application.name=AdCampaignApp
# Database Configuration. Defaults match the role/database app-setup's
# install guides create on a fresh machine (see app-setup/README.md) -
# override via env vars (DB_URL/DB_USERNAME/DB_PASSWORD) for anything else.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/adcampaign}
spring.datasource.username=${DB_USERNAME:adcampaign}
spring.datasource.password=${DB_PASSWORD:adcampaign}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Config
server.port=8080

# Logging
logging.level.org.springframework=INFO

# BidsCube exchange adapter
bidscube.auth-header-name=X-BidsCube-Auth
bidscube.auth-shared-secret=${BIDSCUBE_SHARED_SECRET:}
bidscube.default-tmax-millis=150
bidscube.tmax-safety-margin-millis=20
bidscube.max-request-body-bytes=65536
bidscube.win-notice-base-url=${BIDSCUBE_WIN_NOTICE_BASE_URL:}
# The operator tenant BidsCube's traffic bids against. Register a tenant via
# POST /api/v1/auth/register, then set this to that tenant's id.
bidscube.tenant-id=${BIDSCUBE_TENANT_ID:}

# Local JWT auth (identity module). This default secret is for local dev
# only - every real environment must override it via the env var.
security.jwt.secret=${JWT_SECRET:dev-only-secret-please-override-32bytes-min}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Public /t/** tracking endpoints (measurement module)
measurement.tracking.max-requests-per-window=120
measurement.tracking.window-seconds=60
measurement.tracking.max-query-length=2048

# Administration: email of an already-registered user to grant PLATFORM_ADMIN
# to on startup (idempotent, no-op if blank or user doesn't exist yet).
administration.bootstrap-admin-email=${ADMIN_BOOTSTRAP_EMAIL:}

